[project]
name = "sentiment-analysis"
version = "0.1.0"
description = "Modelo ML para analisis de sentimientos - Equipo 42"
readme = "README.md"
authors = [
    { name = "luis-cm-linux", email = "115508520+luiscm17@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "jupyter>=1.1.1",
    "matplotlib>=3.10.9",
    "nbconvert>=7.17.1",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "plotly>=6.7.0",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sentiment_analysis"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
